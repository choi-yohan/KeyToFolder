const $=id=>document.getElementById(id);
let state=null,busy=false,zoom=1,toastTimer,currentImageId=null;
function t(key,variables={}){let value=TRANSLATIONS[state?.language||'en-US'][key]||key;for(const [name,text] of Object.entries(variables))value=value.replaceAll('{'+name+'}',text);return value}
function number(value){return Number(value).toLocaleString(state?.language||'en-US')}
function applyLanguage(){document.documentElement.lang=state?.language||'en-US';document.title=t('appTitle');for(const el of document.querySelectorAll('[data-i18n]'))el.textContent=t(el.dataset.i18n);for(const [attr,property] of [['aria-label','i18nAria'],['alt','i18nAlt']])for(const el of document.querySelectorAll('[data-'+property.replace(/[A-Z]/g,c=>'-'+c.toLowerCase())+']'))el.setAttribute(attr,t(el.dataset[property]));$('shortcutHint').replaceChildren();for(const key of ['shortcutPrevious','shortcutSkip','shortcutUndo']){const line=element('div',t(key));$('shortcutHint').append(line)}$('languageClose').hidden=!state?.language;$('chooseKo').setAttribute('aria-pressed',String(state?.language==='ko-KR'));$('chooseEn').setAttribute('aria-pressed',String(state?.language==='en-US'));for(const el of document.querySelectorAll('[data-i18n-placeholder]'))el.placeholder=t(el.dataset.i18nPlaceholder);$('clearMapping').title=t('unassign');setZoom()}
function toast(text,bad=false){$('toast').textContent=text;$('toast').className='visible'+(bad?' bad':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').className='',bad?5000:1900)}
async function api(action,body){const options={headers:{'X-Sorter-Token':TOKEN}};if(body!==undefined){options.method='POST';options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}const res=await fetch('/api/'+action,options);const result=await res.json();if(!res.ok)throw Error(result.error||t('actionError'));return result}
function element(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function renderLastMove(s){const last=s.lastMove;$('lastMoveEmpty').hidden=!!last;$('lastMoveContent').hidden=!last;$('lastMoveUndo').disabled=busy||!s.canUndo;const image=$('lastMoveImage');if(!last){image.removeAttribute('src');delete image.dataset.moveId;return}$('lastMoveName').textContent=last.name;$('lastMoveName').title=last.name;for(const [id,path] of [['lastMoveDestination',last.destination],['lastMoveSource',last.source]]){const node=$(id);node.textContent=path.slice(0,Math.max(path.lastIndexOf('/'),path.lastIndexOf('\\')))||path;node.title=path}image.hidden=!last.available;$('lastMoveUnavailable').hidden=last.available;image.onerror=()=>{image.hidden=true;$('lastMoveUnavailable').hidden=false};if(last.available&&image.dataset.moveId!==last.id){image.dataset.moveId=last.id;image.src='/undo-thumbnail?id='+encodeURIComponent(last.id)+'&token='+encodeURIComponent(TOKEN)}else if(!last.available){image.removeAttribute('src');delete image.dataset.moveId}}
function render(s){state=s;applyLanguage();renderLastMove(s);$('counter').textContent=t('remaining',{n:number(s.remaining)});$('undo').disabled=busy||!s.canUndo;$('previous').disabled=busy||!s.image||s.position<=1;$('next').disabled=busy||!s.image||s.position>=s.remaining;$('mapCount').textContent=Object.keys(s.mappings).length+' / '+KEYS.length;$('sourcePath').textContent=s.source||t('notSelected');$('keyList').replaceChildren();for(const key of KEYS){const map=s.mappings[key];if(!map)continue;const button=element('button',undefined,'key-item');button.append(element('span',key.toUpperCase(),'keycap'),element('span',map.label,'key-label'));button.title=map.path;button.disabled=busy||!s.image;button.onclick=()=>move(key);$('keyList').append(button)}if(!Object.keys(s.mappings).length)$('keyList').append(element('p',t('setMappings'),'hint'));
if(s.image){$('empty').style.display='none';$('image').style.display='block';$('tools').hidden=false;$('filename').textContent=s.image.name;$('detail').textContent=s.image.extension+' · '+t('position',{n:number(s.position),total:number(s.remaining)})+(s.image.relative!==s.image.name?' · '+s.image.relative:'');if(currentImageId!==s.image.id){currentImageId=s.image.id;zoom=1;setZoom();$('image').src='/image?id='+encodeURIComponent(s.image.id)+'&token='+encodeURIComponent(TOKEN)}}else{$('image').removeAttribute('src');$('image').style.display='none';$('empty').style.display='block';$('tools').hidden=true;currentImageId=null;$('filename').textContent=t(s.source?'noImages':'noImageSelected');$('detail').textContent=t(s.source?'noImagesDetail':'formats');$('empty').replaceChildren(element('div',s.source?'✓':'⌘','glyph'),element('strong',t(s.source?'doneTitle':'emptyTitle')),element('p',t(s.source?'doneDescription':'emptyDescription')));const button=element('button',t(s.source?'refresh':'emptyButton'),'primary');button.onclick=s.source?()=>act('refresh',{}):sourceDialog;$('empty').append(button)}syncThumbnails(s);}
async function act(action,body,message){if(busy||!state?.language)return;busy=true;render(state);try{const s=await api(action,body);busy=false;render(s);if(message)toast(message)}catch(e){busy=false;render(state);toast(e.message,true)}}
function move(key){if(!state?.image||busy)return;const m=state.mappings[key];if(m)act('move',{key,id:state.image.id},t('moveSuccess',{label:m.label}))}
function setZoom(){zoom=Math.max(.25,Math.min(8,zoom));$('image').style.transform='scale('+zoom+')';$('zoomReset').textContent=zoom===1?t('fit'):Math.round(zoom*100)+'%'}

function thumbnailRowHeight(){const viewport=$('thumbnailViewport');const cardHeight=Math.ceil(Math.max(48,viewport.clientWidth-12)*3/4)+32;viewport.style.setProperty('--thumb-card-height',cardHeight+'px');return cardHeight+6}
let thumbRevision=-1,thumbCache=new Map(),thumbSelectionId=null,thumbRequest=0,thumbFrame=0;
function thumbnailColumns(){return 1}
function syncThumbnails(s){
 if(thumbRevision!==s.revision){thumbRevision=s.revision;thumbCache.clear();thumbRequest++;$('thumbnailGrid').replaceChildren()}
 const cols=thumbnailColumns(),vp=$('thumbnailViewport'),rowHeight=thumbnailRowHeight();
 $('thumbnailSpacer').style.height=Math.ceil(s.remaining/cols)*rowHeight+'px';
 $('thumbnailEmpty').hidden=Boolean(s.remaining);
 $('thumbnailEmpty').textContent=t(s.source?'thumbnailDone':'thumbnailEmpty');
 $('refreshThumbs').disabled=busy||!s.source||!s.language;
 const selected=s.image?.id||null;
 if(selected!==thumbSelectionId){
  thumbSelectionId=selected;
  if(selected){const row=Math.floor((s.position-1)/cols),top=row*rowHeight;
   if(top<vp.scrollTop||top+rowHeight>vp.scrollTop+vp.clientHeight)vp.scrollTop=Math.max(0,top-(vp.clientHeight-rowHeight)/2)}
 }
 renderThumbnails();
}
async function renderThumbnails(){
 const s=state;if(!s)return;
 const seq=++thumbRequest,vp=$('thumbnailViewport'),cols=thumbnailColumns(),rowHeight=thumbnailRowHeight();
 const firstRow=Math.max(0,Math.floor(vp.scrollTop/rowHeight)-2);
 const rows=Math.ceil(vp.clientHeight/rowHeight)+5;
 const start=firstRow*cols,end=Math.min(s.remaining,start+rows*cols);
 if(end>start&&Array.from({length:end-start},(_,i)=>start+i).some(i=>!thumbCache.has(i))){
  try{
   const page=await api('files?start='+start+'&limit='+(end-start));
   if(page.revision!==state.revision||seq!==thumbRequest)return;
   for(const item of page.items)thumbCache.set(item.index,item);
  }catch(e){if(seq===thumbRequest)toast(e.message,true);return}
 }
 if(seq!==thumbRequest)return;
 const grid=$('thumbnailGrid');grid.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';grid.style.top=firstRow*rowHeight+'px';grid.replaceChildren();
 for(let index=start;index<end;index++){
  const item=thumbCache.get(index);if(!item)continue;
  const button=element('button',undefined,'thumbnail-card');button.title=item.name;button.setAttribute('aria-label',item.name);button.setAttribute('aria-current',String(item.id===state.image?.id));button.disabled=busy;
  const image=element('img',undefined,'thumbnail-image');image.alt='';image.loading='lazy';image.decoding='async';image.src='/thumbnail?id='+encodeURIComponent(item.id)+'&revision='+thumbRevision+'&token='+encodeURIComponent(TOKEN);image.onerror=()=>{image.hidden=true;button.title=item.name+' — '+t('thumbnailUnavailable')};
  button.append(image,element('span',item.name,'thumbnail-name'));button.onclick=()=>act('select',{id:item.id});grid.append(button);
 }
}
$('thumbnailViewport').addEventListener('scroll',()=>{cancelAnimationFrame(thumbFrame);thumbFrame=requestAnimationFrame(renderThumbnails)},{passive:true});
window.addEventListener('resize',()=>{if(state)syncThumbnails(state)});
$('refreshThumbs').onclick=()=>act('refresh',{});

function sourceDialog(){if(busy||!state?.language)return;$('sourceInput').value=state.source||'';$('recursive').checked=state.recursive||false;$('sourceError').textContent='';$('sourceDialog').showModal()}

let mappingDraft={},selectedMappingKey=null;
const KEYBOARD_ROWS=[
 {keys:'1234567890-=',before:['',1.0],after:['Backspace',1.5]},
 {keys:'qwertyuiop[]',before:['Tab',1.5],after:['',1.0]},
 {keys:"asdfghjkl;'",before:['Caps Lock',1.7],after:['Return',1.9]},
 {keys:'zxcvbnm,./',before:['Shift',2.35],after:['Shift',2.35]}
];
function folderName(path){return path.replaceAll(String.fromCharCode(92),'/').replace(/\/$/,'').split('/').pop()||path}
function fitKeyboard(){const layout=document.getElementById('keyboardLayout'),firstRow=layout.querySelector('.keyboard-row');if(!firstRow||layout.clientWidth===0)return;const gap=parseFloat(getComputedStyle(firstRow).columnGap)||0,sizes=KEYBOARD_ROWS.map(row=>{const count=row.keys.length,extraCount=Number(Boolean(row.before))+Number(Boolean(row.after)),units=count+(row.before?.[1]||0)+(row.after?.[1]||0);return(layout.clientWidth-gap*(count+extraCount-1))/units});layout.style.setProperty('--key-size',Math.floor(Math.min(...sizes))+'px')}new ResizeObserver(fitKeyboard).observe(document.getElementById('keyboardLayout'));function renderKeyboard(){
 const layout=$('keyboardLayout');layout.replaceChildren();
 for(const definition of KEYBOARD_ROWS){
  const row=element('div',undefined,'keyboard-row');
  function placeholder(info){const key=element('span',info[0],'keyboard-placeholder');key.style.setProperty('--key-width',info[1]);key.setAttribute('aria-hidden','true');row.append(key)}
  if(definition.before)placeholder(definition.before);
  for(const key of definition.keys){
   const map=mappingDraft[key],assigned=Boolean(map?.path?.trim());
   const wrap=element('div',undefined,'keyboard-key-wrap');
   const button=element('button',key.toUpperCase(),'keyboard-key'+(assigned?' assigned':'')+(selectedMappingKey===key?' selected':''));button.type='button';button.dataset.key=key;button.setAttribute('aria-label',key.toUpperCase());button.setAttribute('aria-pressed',String(selectedMappingKey===key));button.onclick=()=>selectMappingKey(key);
   wrap.append(button);
   if(assigned){const name=folderName(map.path.trim());const tip=element('span',name,'keyboard-tooltip');tip.id='mapping-tip-'+key.charCodeAt(0);button.setAttribute('aria-describedby',tip.id);wrap.append(tip)}
   row.append(wrap);
  }
  if(definition.after)placeholder(definition.after);
  layout.append(row);
 }
}
function selectMappingKey(key){selectedMappingKey=key;const map=mappingDraft[key]||{};$('selectedMappingKey').textContent=key.toUpperCase();$('mappingEditorHint').textContent=t('editingMapping',{key:key.toUpperCase()});$('mappingFields').disabled=false;$('mappingPath').value=map.path||'';$('mappingLabel').value=map.label||'';renderKeyboard();$('mappingPath').focus()}
function updateMappingDraft(){if(!selectedMappingKey)return;const path=$('mappingPath').value.trim(),label=$('mappingLabel').value.trim();if(path)mappingDraft[selectedMappingKey]={path,label:label||folderName(path)};else delete mappingDraft[selectedMappingKey];renderKeyboard()}
function mappingDialog(){if(busy||!state?.language)return;mappingDraft=JSON.parse(JSON.stringify(state.mappings));selectedMappingKey=null;$('mappingError').textContent='';$('selectedMappingKey').textContent='—';$('mappingEditorHint').textContent=t('chooseMappingKey');$('mappingFields').disabled=true;$('mappingPath').value='';$('mappingLabel').value='';renderKeyboard();$('mappingDialog').showModal()}
$('mappingPath').addEventListener('input',updateMappingDraft);$('mappingLabel').addEventListener('input',updateMappingDraft);
$('clearMapping').onclick=()=>{$('mappingPath').value='';$('mappingLabel').value='';updateMappingDraft();$('mappingPath').focus()};
$('pickMapping').onclick=async()=>{const key=selectedMappingKey;if(!key)return;$('pickMapping').disabled=true;try{const result=await api('pick',{});if(result.path){mappingDraft[key]={path:result.path,label:mappingDraft[key]?.label||folderName(result.path)};if(selectedMappingKey===key){$('mappingPath').value=mappingDraft[key].path;$('mappingLabel').value=mappingDraft[key].label}renderKeyboard()}}catch(e){$('mappingError').textContent=e.message}finally{$('pickMapping').disabled=false}};

function languageDialog(){if(busy)return;$('languageError').textContent='';$('languageDialog').showModal()}
async function chooseLanguage(language){$('chooseKo').disabled=$('chooseEn').disabled=true;try{render(await api('language',{language}));$('languageDialog').close();toast(t('languageSaved'))}catch(e){$('languageError').textContent=e.message}finally{$('chooseKo').disabled=$('chooseEn').disabled=false}}
$('chooseKo').onclick=()=>chooseLanguage('ko-KR');$('chooseEn').onclick=()=>chooseLanguage('en-US');$('languageButton').onclick=languageDialog;$('languageDialog').addEventListener('cancel',e=>{if(!state?.language)e.preventDefault()});$('languageDialog').addEventListener('close',()=>{if(!state?.language)$('languageDialog').showModal()});$('languageDialog').addEventListener('keydown',e=>{if(e.key==='Escape'&&!state?.language)e.preventDefault()});
$('sourceButton').onclick=sourceDialog;$('mappingButton').onclick=mappingDialog;
for(const button of document.querySelectorAll('[data-close]'))button.onclick=()=>$(button.dataset.close).close();
$('pickSource').onclick=async()=>{$('pickSource').disabled=true;try{const r=await api('pick',{});if(r.path)$('sourceInput').value=r.path}catch(e){$('sourceError').textContent=e.message}finally{$('pickSource').disabled=false}};
$('loadSource').onclick=async()=>{$('loadSource').disabled=true;try{render(await api('source',{path:$('sourceInput').value,recursive:$('recursive').checked}));$('sourceDialog').close();if(!Object.keys(state.mappings).length)mappingDialog()}catch(e){$('sourceError').textContent=e.message}finally{$('loadSource').disabled=false}};
$('saveMappings').onclick=async()=>{updateMappingDraft();const mappings=JSON.parse(JSON.stringify(mappingDraft));$('saveMappings').disabled=true;try{render(await api('mappings',{mappings}));$('mappingDialog').close();toast(t('settingsSaved'))}catch(e){$('mappingError').textContent=e.message}finally{$('saveMappings').disabled=false}};
$('lastMoveUndo').onclick=$('undo').onclick=()=>act('undo',{},t('undoSuccess'));$('previous').onclick=()=>act('navigate',{delta:-1});$('next').onclick=()=>act('navigate',{delta:1});$('zoomIn').onclick=()=>{zoom*=1.25;setZoom()};$('zoomOut').onclick=()=>{zoom/=1.25;setZoom()};$('zoomReset').onclick=()=>{zoom=1;setZoom()};$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('viewer').requestFullscreen()};
$('viewer').addEventListener('wheel',e=>{if(!state?.image)return;e.preventDefault();zoom*=e.deltaY<0?1.1:1/1.1;setZoom()},{passive:false});
$('image').onerror=()=>toast(t('previewError'),true);
function mappedKey(event){if(event.code.startsWith('Key'))return event.code.slice(3).toLowerCase();if(event.code.startsWith('Digit'))return event.code.slice(5);const punctuation={Minus:'-',Equal:'=',BracketLeft:'[',BracketRight:']',Slash:'/',Semicolon:';',Quote:"'",Comma:',',Period:'.'};return punctuation[event.code]||(!event.code?event.key.toLowerCase():null)}
document.addEventListener('keydown',e=>{if(!state?.language||document.querySelector('dialog[open]')||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.isComposing||e.repeat)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();act('undo',{},t('undoSuccess'));return}if(e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='ArrowLeft'){e.preventDefault();act('navigate',{delta:-1})}else if(e.key==='ArrowRight'||e.code==='Space'){e.preventDefault();act('navigate',{delta:1})}else{const key=mappedKey(e);if(key&&KEYS.includes(key)&&state.mappings[key]){e.preventDefault();move(key)}}});
applyLanguage();api('state').then(s=>{render(s);if(!s.language)languageDialog()}).catch(e=>toast(e.message,true));
</script>
